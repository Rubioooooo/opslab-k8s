---
- name: Prepare required kernel settings for Kubernetes
  hosts: k8s_cluster
  become: true
  gather_facts: false

  tasks:
    - name: Persist required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          overlay
          br_netfilter
      notify: Load Kubernetes kernel modules

    - name: Load overlay module now
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter module now
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Persist required Kubernetes sysctl parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
      notify: Reload sysctl parameters

  handlers:
    - name: Load Kubernetes kernel modules
      ansible.builtin.command:
        argv:
          - systemctl
          - restart
          - systemd-modules-load.service
      changed_when: true

    - name: Reload sysctl parameters
      ansible.builtin.command:
        argv:
          - sysctl
          - --system
      changed_when: true
