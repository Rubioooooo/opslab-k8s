---
- name: Prepare nodes for Kubernetes
  hosts: k8s_cluster
  become: true
  gather_facts: true

  tasks:
    - name: Disable active swap
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: true

    - name: Disable swap permanently in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\n]+\s+\S+\s+swap\s+\S+.*)$'
        replace: '# \1'
        backup: true

    - name: Configure IPv4 forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Reload sysctl settings

  handlers:
    - name: Reload sysctl settings
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true
