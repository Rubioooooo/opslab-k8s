---
- name: Install and configure containerd
  hosts: k8s_cluster
  become: true
  gather_facts: true

  vars:
    kubernetes_sandbox_image: "registry.k8s.io/pause:3.10.2"

  tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("24.04", ">=")
          - ansible_architecture == "x86_64"
        fail_msg: >-
          Unsupported system:
          {{ ansible_distribution }}
          {{ ansible_distribution_version }}
          {{ ansible_architecture }}

    - name: Update APT package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install containerd
      ansible.builtin.apt:
        name:
          - containerd
        state: present

    - name: Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check whether containerd configuration exists
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
      register: containerd_config

    - name: Generate version-matched default containerd configuration
      ansible.builtin.shell: |
        set -o errexit
        set -o nounset
        set -o pipefail

        temporary_file="$(mktemp)"
        containerd config default > "${temporary_file}"

        install \
          -o root \
          -g root \
          -m 0644 \
          "${temporary_file}" \
          /etc/containerd/config.toml

        rm -f "${temporary_file}"
      args:
        executable: /bin/bash
      when: not containerd_config.stat.exists
      notify: Restart containerd

    - name: Configure containerd to use systemd cgroups
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*SystemdCgroup\s*=\s*)false\s*$'
        replace: '\1true'
      notify: Restart containerd

    - name: Align containerd sandbox image with Kubernetes
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^(\s*sandbox\s*=\s*).*$'
        line: "\\1'{{ kubernetes_sandbox_image }}'"
        backrefs: true
      notify: Restart containerd

    - name: Ensure containerd is enabled and running
      ansible.builtin.systemd_service:
        name: containerd
        enabled: true
        state: started

    - name: Apply pending containerd restart
      ansible.builtin.meta: flush_handlers

    - name: Read installed containerd package version
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Version}"
          - containerd
      register: containerd_package_version
      changed_when: false

    - name: Read containerd binary version
      ansible.builtin.command:
        argv:
          - containerd
          - --version
      register: containerd_binary_version
      changed_when: false

    - name: Read effective configuration version
      ansible.builtin.shell: |
        awk '
          /^[[:space:]]*version[[:space:]]*=/ {
            print
            exit
          }
        ' /etc/containerd/config.toml
      args:
        executable: /bin/bash
      register: containerd_config_version
      changed_when: false

    - name: Read SystemdCgroup configuration
      ansible.builtin.shell: |
        grep -nE '^[[:space:]]*SystemdCgroup[[:space:]]*=' \
          /etc/containerd/config.toml || true
      args:
        executable: /bin/bash
      register: systemd_cgroup_result
      changed_when: false

    - name: Read sandbox image configuration
      ansible.builtin.shell: |
        grep -nE \
          '^[[:space:]]*(sandbox_image|sandbox)[[:space:]]*=' \
          /etc/containerd/config.toml || true
      args:
        executable: /bin/bash
      register: sandbox_image_result
      changed_when: false

    - name: Read disabled plugins configuration
      ansible.builtin.shell: |
        grep -nE '^[[:space:]]*disabled_plugins[[:space:]]*=' \
          /etc/containerd/config.toml || true
      args:
        executable: /bin/bash
      register: disabled_plugins_result
      changed_when: false

    - name: Read containerd service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - containerd
      register: containerd_active
      changed_when: false

    - name: Read containerd enablement state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - containerd
      register: containerd_enabled
      changed_when: false

    - name: Read containerd CRI plugins
      ansible.builtin.shell: |
        ctr plugins ls |
        awk '
          $1 ~ /^io\.containerd\.cri/ ||
          ($1 == "io.containerd.grpc.v1" && $2 == "cri") {
            print
          }
        '
      args:
        executable: /bin/bash
      register: cri_plugins
      changed_when: false

    - name: Verify containerd configuration and service
      ansible.builtin.assert:
        that:
          - containerd_active.stdout | trim == "active"
          - containerd_enabled.stdout | trim == "enabled"
          - systemd_cgroup_result.stdout is search('SystemdCgroup\\s*=\\s*true')
          - cri_plugins.stdout is search('ok')
          - disabled_plugins_result.stdout is not search('"cri"')
          - kubernetes_sandbox_image in sandbox_image_result.stdout
        fail_msg: |
          containerd validation failed:
          active={{ containerd_active.stdout }}
          enabled={{ containerd_enabled.stdout }}
          SystemdCgroup={{ systemd_cgroup_result.stdout }}
          disabled_plugins={{ disabled_plugins_result.stdout }}
          CRI plugins={{ cri_plugins.stdout }}
        success_msg: "containerd service, cgroup driver and CRI checks passed"

    - name: Show containerd report
      ansible.builtin.debug:
        msg:
          - "host={{ inventory_hostname }}"
          - "package_version={{ containerd_package_version.stdout }}"
          - "binary_version={{ containerd_binary_version.stdout }}"
          - "config_version={{ containerd_config_version.stdout }}"
          - "SystemdCgroup={{ systemd_cgroup_result.stdout_lines }}"
          - "sandbox_image={{ sandbox_image_result.stdout_lines }}"
          - "disabled_plugins={{ disabled_plugins_result.stdout_lines }}"
          - "service_active={{ containerd_active.stdout }}"
          - "service_enabled={{ containerd_enabled.stdout }}"
          - "CRI_plugins={{ cri_plugins.stdout_lines }}"

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
