apiVersion: apps/v1
kind: Deployment
metadata:
  name: opslab-redis-exporter
  namespace: opslab
  labels:
    app.kubernetes.io/name: opslab-redis-exporter
    app.kubernetes.io/part-of: opslab-k8s
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: opslab-redis-exporter

  template:
    metadata:
      labels:
        app.kubernetes.io/name: opslab-redis-exporter
        app.kubernetes.io/part-of: opslab-k8s

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redis-exporter
          image: crpi-uxjhyltxd2kcr7f9.cn-hangzhou.personal.cr.aliyuncs.com/k8s-test-111/redis-exporter@sha256:0a43aadebfc704952d487b0af63c63f8a3b5e7d64f30a0b97d28b15be2501820
          imagePullPolicy: IfNotPresent

          ports:
            - name: metrics
              containerPort: 9121
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi

          env:
            - name: REDIS_ADDR
              value: redis://opslab-redis:6379

            - name: REDIS_USER
              valueFrom:
                secretKeyRef:
                  name: opslab-redis-exporter-secret
                  key: REDIS_USER

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opslab-redis-exporter-secret
                  key: REDIS_PASSWORD

            - name: REDIS_EXPORTER_CONFIG_COMMAND
              value: "-"

            - name: REDIS_EXPORTER_SET_CLIENT_NAME
              value: "false"

            - name: REDIS_EXPORTER_EXCLUDE_LATENCY_HISTOGRAM_METRICS
              value: "true"

            - name: REDIS_EXPORTER_EXPORT_CLIENT_LIST
              value: "false"

            - name: REDIS_EXPORTER_PING_ON_CONNECT
              value: "false"

            - name: REDIS_EXPORTER_INCL_METRICS_FOR_EMPTY_DATABASES
              value: "false"

---
apiVersion: v1
kind: Service
metadata:
  name: opslab-redis-exporter
  namespace: opslab
  labels:
    app.kubernetes.io/name: opslab-redis-exporter
    app.kubernetes.io/part-of: opslab-k8s
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: opslab-redis-exporter

  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
      protocol: TCP
