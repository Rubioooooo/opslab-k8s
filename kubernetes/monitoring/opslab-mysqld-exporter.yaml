apiVersion: apps/v1
kind: Deployment
metadata:
  name: opslab-mysqld-exporter
  namespace: opslab
  labels:
    app.kubernetes.io/name: opslab-mysqld-exporter
    app.kubernetes.io/part-of: opslab-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opslab-mysqld-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opslab-mysqld-exporter
        app.kubernetes.io/part-of: opslab-k8s
    spec:
      automountServiceAccountToken: false

      containers:
        - name: mysqld-exporter
          image: crpi-uxjhyltxd2kcr7f9.cn-hangzhou.personal.cr.aliyuncs.com/k8s-test-111/mysqld-exporter@sha256:eadbe14b5e0f39fa1ec479c8083d6153fbc907da054fe36c07f0f64d2819fb28
          imagePullPolicy: IfNotPresent

          args:
            - --mysqld.address=opslab-mysql:3306
            - --mysqld.username=opslab_exporter
            - --no-collect.slave_status
            - --no-collect.info_schema.innodb_cmp
            - --no-collect.info_schema.innodb_cmpmem
            - --no-collect.info_schema.query_response_time

          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opslab-mysqld-exporter-secret
                  key: MYSQLD_EXPORTER_PASSWORD

          ports:
            - name: metrics
              containerPort: 9104
              protocol: TCP

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault

---
apiVersion: v1
kind: Service
metadata:
  name: opslab-mysqld-exporter
  namespace: opslab
  labels:
    app.kubernetes.io/name: opslab-mysqld-exporter
    app.kubernetes.io/part-of: opslab-k8s
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opslab-mysqld-exporter
  ports:
    - name: metrics
      port: 9104
      targetPort: metrics
      protocol: TCP
