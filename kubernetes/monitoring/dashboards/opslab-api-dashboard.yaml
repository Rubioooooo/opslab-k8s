apiVersion: v1
kind: ConfigMap
metadata:
  name: opslab-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  opslab-api-dashboard.json: |
    {
      "uid": "opslab-fastapi-overview",
      "title": "OpsLab / FastAPI Application Overview",
      "description": "Application-level observability dashboard for OpsLab FastAPI workloads.",
      "tags": [
        "opslab",
        "fastapi",
        "kubernetes",
        "sre"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "multi": false,
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Business QPS",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(opslab_http_requests_total{namespace=\"opslab\",service=\"opslab-api\",route=~\"/api/v1/.*\"}[$__rate_interval]))",
              "legendFormat": "Business QPS"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Request Rate by Route",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (route) (rate(opslab_http_requests_total{namespace=\"opslab\",service=\"opslab-api\",route=~\"/api/v1/.*\"}[$__rate_interval]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP 2xx / 4xx / 5xx",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(opslab_http_requests_total{namespace=\"opslab\",service=\"opslab-api\",route=~\"/api/v1/.*\",status_code=~\"2..\"}[$__rate_interval])) or vector(0)",
              "legendFormat": "2xx"
            },
            {
              "refId": "B",
              "expr": "sum(rate(opslab_http_requests_total{namespace=\"opslab\",service=\"opslab-api\",route=~\"/api/v1/.*\",status_code=~\"4..\"}[$__rate_interval])) or vector(0)",
              "legendFormat": "4xx"
            },
            {
              "refId": "C",
              "expr": "sum(rate(opslab_http_requests_total{namespace=\"opslab\",service=\"opslab-api\",route=~\"/api/v1/.*\",status_code=~\"5..\"}[$__rate_interval])) or vector(0)",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "FastAPI P95 Request Latency",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(opslab_http_request_duration_seconds_bucket{namespace=\"opslab\",service=\"opslab-api\",route=~\"/api/v1/.*\"}[$__rate_interval])))",
              "legendFormat": "P95"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "FastAPI Pod CPU",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"opslab\",container=\"opslab-api\",pod=~\"opslab-api-.*\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "FastAPI Pod Memory",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"opslab\",container=\"opslab-api\",pod=~\"opslab-api-.*\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Deployment Available Replicas",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"opslab\",deployment=\"opslab-api\"}",
              "legendFormat": "Available"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "HPA Current / Desired Replicas",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"opslab\",horizontalpodautoscaler=\"opslab-api\"}",
              "legendFormat": "Current"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"opslab\",horizontalpodautoscaler=\"opslab-api\"}",
              "legendFormat": "Desired"
            }
          ]
        }
      ]
    }
