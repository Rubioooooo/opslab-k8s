apiVersion: v1
kind: ConfigMap
metadata:
  name: opslab-mysql-config
  namespace: opslab
data:
  opslab.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_0900_ai_ci
    max_connections=200
    skip-name-resolve
---
apiVersion: v1
kind: Service
metadata:
  name: opslab-mysql-headless
  namespace: opslab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: opslab-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: opslab-mysql
  namespace: opslab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opslab-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opslab-mysql
  namespace: opslab
spec:
  serviceName: opslab-mysql-headless
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: opslab-mysql

  template:
    metadata:
      labels:
        app.kubernetes.io/name: opslab-mysql

    spec:
      terminationGracePeriodSeconds: 60

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: prepare-data-permissions
          image: crpi-uxjhyltxd2kcr7f9.cn-hangzhou.personal.cr.aliyuncs.com/k8s-test-111/mysql@sha256:3a299410177c29055174e5439d7ba2ad4377f20bd716ace29f67c42497012916

          command:
            - /bin/sh
            - -ec
            - |
              chown 999:999 /var/lib/mysql
              chmod 750 /var/lib/mysql

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

      containers:
        - name: mysql
          image: crpi-uxjhyltxd2kcr7f9.cn-hangzhou.personal.cr.aliyuncs.com/k8s-test-111/mysql@sha256:3a299410177c29055174e5439d7ba2ad4377f20bd716ace29f67c42497012916
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306

          envFrom:
            - secretRef:
                name: opslab-mysql-secret

          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 --silent
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mysql -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 --silent
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

            - name: mysql-config
              mountPath: /etc/mysql/conf.d/opslab.cnf
              subPath: opslab.cnf
              readOnly: true

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: opslab-mysql-data

        - name: mysql-config
          configMap:
            name: opslab-mysql-config
