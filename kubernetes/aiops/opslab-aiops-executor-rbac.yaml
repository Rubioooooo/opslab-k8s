apiVersion: v1
kind: ServiceAccount
metadata:
  name: opslab-aiops-executor
  namespace: opslab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opslab-aiops-executor
  namespace: opslab
rules:
  - apiGroups:
      - ""
    resources:
      - pods/eviction
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opslab-aiops-executor
  namespace: opslab
subjects:
  - kind: ServiceAccount
    name: opslab-aiops-executor
    namespace: opslab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opslab-aiops-executor
