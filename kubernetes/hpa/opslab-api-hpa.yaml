apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opslab-api
  namespace: opslab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opslab-api

  minReplicas: 2
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
