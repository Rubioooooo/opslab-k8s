apiVersion: v1
kind: Pod
metadata:
  name: mysql-local-pv-test
  namespace: opslab
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  containers:
    - name: test
      image: crpi-uxjhyltxd2kcr7f9.cn-hangzhou.personal.cr.aliyuncs.com/k8s-test-111/opslab-api@sha256:f9484afd2fe43d8b1a269572a2b8d7520d0116e0def4b240aec199561f41a32e
      command:
        - /bin/sh
        - -c
        - |
          echo "mysql-local-pv-ok" > /mnt/data/opslab-storage-test.txt
          cat /mnt/data/opslab-storage-test.txt
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /mnt/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: opslab-mysql-data
