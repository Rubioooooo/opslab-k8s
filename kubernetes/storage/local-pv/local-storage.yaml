apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: opslab-mysql-local-pv
  labels:
    opslab.io/storage-role: mysql
spec:
  capacity:
    storage: 18Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/mysql
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: opslab-redis-local-pv
  labels:
    opslab.io/storage-role: redis
spec:
  capacity:
    storage: 18Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opslab-mysql-data
  namespace: opslab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 18Gi
  selector:
    matchLabels:
      opslab.io/storage-role: mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opslab-redis-data
  namespace: opslab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 18Gi
  selector:
    matchLabels:
      opslab.io/storage-role: redis
